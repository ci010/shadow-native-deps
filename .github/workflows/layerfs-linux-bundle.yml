name: Build test-only LayerFS Linux bundle (x64)
on:
  workflow_dispatch:
    inputs:
      upload_artifact:
        description: Retain the verified bundle as a downloadable artifact (private repositories only)
        type: boolean
        default: false
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      # A public producer can build and verify, but never upload payloads.
      - name: Reject artifact requests outside a private repository
        if: inputs.upload_artifact && github.event.repository.private != true
        run: |
          echo '::error::Downloadable test bundles are private-only. Dispatch with upload_artifact=false for build and verification.'
          exit 1
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Build and verify the sealed bundle without starting LayerFS
        run: bash integrations/layerfs-linux-bundle/build.sh
      - name: Retain the verified test bundle (private opt-in)
        if: inputs.upload_artifact && github.event.repository.private == true
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: layerfs-test-only-2.0.0-linux-x86_64-ff114a52
          path: |
            ${{ runner.temp }}/layerfs-test-bundle/layerfs-test-only-2.0.0-linux-x86_64.tar.gz
            ${{ runner.temp }}/layerfs-test-bundle/SHA256SUMS
          if-no-files-found: error
          compression-level: 0
          retention-days: 7
